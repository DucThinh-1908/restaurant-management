<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="admin-sidebar" th:fragment="sidebar(activeAdminPage)">
  <div class="admin-brand">
    <strong>DUC THINH</strong>
    <span>INTERNAL SYSTEM</span>
  </div>

  <nav class="admin-nav" th:if="${employee != null}">
    <!-- Bảng điều khiển chung (ADMIN / MANAGER) -->
    <a th:if="${employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}" 
       th:href="@{/admin}" th:classappend="${activeAdminPage == 'dashboard'} ? 'active' : ''">
      <span class="admin-nav-icon">📊</span> Bảng Điều Khiển
    </a>

    <!-- NGHIỆP VỤ LỄ TÂN (RECEPTIONIST, ADMIN, MANAGER) -->
    <div style="padding: 10px 20px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .15em; color: var(--admin-gold); font-weight: bold;">
      Bàn Làm Việc
    </div>

    <!-- Đặt bàn (Chuyên trách Lễ tân) -->
    <a th:if="${employee.roleName == 'RECEPTIONIST' or employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}"
       th:href="@{/admin/reservations}" th:classappend="${activeAdminPage == 'reservations'} ? 'active' : ''">
      <span class="admin-nav-icon">📅</span> Đặt Bàn (Lễ Tân)
    </a>

    <!-- Sơ đồ bàn (Lễ tân, Phục vụ, Quản lý) -->
    <a th:if="${employee.roleName == 'RECEPTIONIST' or employee.roleName == 'WAITER' or employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}"
       th:href="@{/admin/tables}" th:classappend="${activeAdminPage == 'tables'} ? 'active' : ''">
      <span class="admin-nav-icon">🪑</span> Sơ Đồ Bàn Ăn
    </a>

    <!-- Đơn hàng (Thu ngân, Phục vụ, Bếp, Quản lý) -->
    <a th:if="${employee.roleName == 'CASHIER' or employee.roleName == 'CHEF' or employee.roleName == 'WAITER' or employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}"
       th:href="@{/admin/orders}" th:classappend="${activeAdminPage == 'orders'} ? 'active' : ''">
      <span class="admin-nav-icon">🛒</span> Quản Lý Đơn Hàng
    </a>

    <!-- Thực đơn (Bếp, Quản lý, Admin) -->
    <a th:if="${employee.roleName == 'CHEF' or employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}"
       th:href="@{/admin/menu}" th:classappend="${activeAdminPage == 'menu'} ? 'active' : ''">
      <span class="admin-nav-icon">🍲</span> Quản Lý Thực Đơn
    </a>

    <!-- Quản lý kho (Thủ kho, Bếp trưởng, Quản lý) -->
    <a th:if="${employee.roleName == 'STOREKEEPER' or employee.roleName == 'CHEF' or employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}"
       th:href="@{/admin/inventory}" th:classappend="${activeAdminPage == 'inventory'} ? 'active' : ''">
      <span class="admin-nav-icon">📦</span> Quản Lý Kho (Thủ Kho)
    </a>

    <!-- Quản trị nhân sự (Chỉ ADMIN & MANAGER) -->
    <a th:if="${employee.roleName == 'ADMIN' or employee.roleName == 'MANAGER'}"
       th:href="@{/admin/staff}" th:classappend="${activeAdminPage == 'staff'} ? 'active' : ''">
      <span class="admin-nav-icon">👥</span> Quản Lý Nhân Sự (7 Roles)
    </a>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 20px;">
    
    <a th:href="@{/}" target="_blank">
      <span class="admin-nav-icon">🌐</span> Xem Website Khách
    </a>
  </nav>

  <div class="admin-sidebar-footer">
    <div class="admin-user-info" th:if="${employee != null}">
      <div class="admin-user-avatar" th:text="${#strings.substring(employee.fullName, 0, 1)}">A</div>
      <div>
        <strong th:text="${employee.fullName}" style="color: #fff; display: block;">Hoàng Lễ Tân</strong>
        <span th:text="${employee.roleName}" style="color: var(--admin-gold); font-size: 11px; font-weight: bold;">RECEPTIONIST</span>
      </div>
    </div>
    <a th:href="@{/admin/logout}" style="color: #e06c75; text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 6px;">
      <span>🚪</span> Đăng xuất ca làm việc
    </a>
  </div>
</aside>
</body>
</html>
