<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle ?: 'Đăng nhập Quản Trị | Duc Thinh Restaurant'}">Đăng nhập Quản Trị</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body" style="display: grid; place-items: center; min-height: 100vh; background: #1a1715;">

  <div style="width: min(420px, calc(100% - 32px)); background: #fff; padding: 36px; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
    <div style="text-align: center; margin-bottom: 25px;">
      <strong style="font-family: 'Playfair Display', 'Times New Roman', serif; font-size: 26px; letter-spacing: .15em; display: block;">DUC THINH</strong>
      <span style="font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--admin-gold); font-weight: bold;">STAFF &amp; ADMIN PORTAL</span>
    </div>

    <!-- Thông báo lỗi hoặc thành công -->
    <div th:if="${errorMessage}" style="background: #fdf2f2; color: #9b2c2c; padding: 12px; font-size: 13px; border-radius: 4px; margin-bottom: 18px; border: 1px solid #fed7d7;">
      <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" style="background: #edf7ed; color: #1e4620; padding: 12px; font-size: 13px; border-radius: 4px; margin-bottom: 18px; border: 1px solid #c2e2c4;">
      <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/admin/login}" method="post">
      <div style="margin-bottom: 16px;">
        <label for="username" style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 600; color: #666; margin-bottom: 6px;">Tên đăng nhập / Email *</label>
        <input id="username" name="username" type="text" required autofocus placeholder="admin hoặc username" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; outline: none; font-size: 14px;">
      </div>

      <div style="margin-bottom: 22px;">
        <label for="password" style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 600; color: #666; margin-bottom: 6px;">Mật khẩu nội bộ *</label>
        <input id="password" name="password" type="password" required placeholder="••••••••" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; outline: none; font-size: 14px;">
      </div>

      <button type="submit" class="btn-gold" style="width: 100%; padding: 13px; justify-content: center; font-size: 13px;">
        Đăng nhập hệ thống
      </button>
    </form>

    <div style="margin-top: 25px; padding-top: 18px; border-top: 1px solid #eee; text-align: center; font-size: 12px; color: #888;">
      <a th:href="@{/}" style="color: #666; text-decoration: none;">← Quay lại trang chủ Website</a>
    </div>

</body>
</html>
