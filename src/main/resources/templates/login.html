<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập hệ thống | GoD Fine Dining')}">
  <meta charset="utf-8">
  <title>Đăng nhập hệ thống | Duc Thinh Restaurant</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header th:replace="~{fragments/header :: header('login')}"></header>

<main>
  <section class="section" style="padding-top: 50px; min-height: calc(100vh - 250px);">
    <div class="container" style="max-width: 540px;">
      <div class="form-card" style="box-shadow: 0 10px 30px rgba(0,0,0,0.06); border-radius: 6px;">
        <span class="eyebrow" style="text-align: center;">Cổng Đăng Nhập Hệ Thống</span>
        <h2 style="text-align: center; margin-bottom: 22px;">Đăng Nhập</h2>

        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert-box alert-success" style="margin-bottom: 18px;">
          <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert-box alert-error" style="margin-bottom: 18px;">
          <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
          <input type="hidden" name="redirect" th:value="${redirect}">
          
          <div class="form-field" style="margin-bottom: 16px;">
            <label for="email">Tên đăng nhập hoặc Email *</label>
            <input id="email" name="email" type="text" required placeholder="Email khách hàng hoặc username nhân viên" autofocus>
          </div>

          <div class="form-field" style="margin-bottom: 22px;">
            <label for="password">Mật khẩu *</label>
            <input id="password" name="password" type="password" required placeholder="••••••••">
          </div>

          <button type="submit" class="button-gold" style="width: 100%; padding: 14px; font-weight: bold; font-size: 11px;">
            Đăng nhập hệ thống
          </button>
        </form>

        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; color: var(--muted);">
          <span>Khách hàng chưa có tài khoản? </span>
          <a th:href="@{/register}" style="color: var(--gold-dark); font-weight: bold; text-decoration: underline;">Đăng ký thành viên ngay</a>
        </div>


      </div>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
